<!doctype html>
<html><head><meta charset="utf-8">
<title>序时 · 弹层与细节</title>
<style>
  html,body{margin:0;background:#0d0f14;font:12px -apple-system,"PingFang SC",sans-serif;color:#8b93a1}
  .row{display:flex;gap:14px;padding:14px;align-items:flex-start}
  figure{margin:0}
  iframe{width:390px;height:844px;border:0;border-radius:20px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block}
  figcaption{text-align:center;padding-top:6px;letter-spacing:.08em;font-size:10px}
</style></head>
<body>
<div class="row" id="row"></div>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || '';
const specs = [
  { hash: 'today', cap: '新建日程弹层', run: (w, d) => d.querySelector('[data-act="newEvent"]').click() },
  { hash: 'me', cap: 'AI 接口设置', run: (w, d) => d.querySelector('[data-act="openAI"]').click() },
  { hash: 'links', cap: '添加入口', run: (w, d) => d.querySelector('[data-act="linkEdit"]').click() },
  { hash: 'me', cap: '我的·下半页', run: (w, d) => { d.querySelector('#view').scrollTop = 99999; } }
];
const row = document.getElementById('row');
row.innerHTML = specs.map((s, i) =>
  `<figure><iframe id="f${i}" src="../index.html?${theme ? 'theme=' + theme : ''}#${s.hash}"></iframe><figcaption>${s.cap}</figcaption></figure>`
).join('');
specs.forEach((s, i) => {
  const f = document.getElementById('f' + i);
  f.onload = () => setTimeout(() => {
    try { s.run(f.contentWindow, f.contentDocument); } catch (e) { console.error(i, e.message); }
  }, 700);
});
</script>
</body></html>
