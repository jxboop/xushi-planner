<!doctype html>
<html><head><meta charset="utf-8">
<title>序时 · 多页预览</title>
<style>
  html,body{margin:0;background:#0d0f14;font:12px -apple-system,"PingFang SC",sans-serif;color:#8b93a1}
  .row{display:flex;gap:14px;padding:14px;align-items:flex-start}
  figure{margin:0}
  iframe{width:390px;height:844px;border:0;border-radius:20px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block}
  figcaption{text-align:center;padding-top:6px;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
</style></head>
<body>
<div class="row" id="row"></div>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get('theme') || '';
  const pages = ['today', 'calendar', 'ai', 'links', 'me'];
  const names = { today: '今天', calendar: '日历', ai: 'AI', links: '入口', me: '我的' };
  document.getElementById('row').innerHTML = pages.map(p =>
    `<figure><iframe src="../index.html?${theme ? 'theme=' + theme : ''}#${p}"></iframe><figcaption>${names[p]}</figcaption></figure>`
  ).join('');
</script>
</body></html>
